<!DOCTYPE>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin page (REST)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <style>
        .sidebar {
            height: 100vh;
            width: 200px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #ffffff;
            padding-top: 80px;
        }

        .sidebar-item {
            padding: 10px 15px;
            text-decoration: none;
            color: #007bff;
            display: block;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 5px;
        }

        .sidebar-item.active {
            background-color: #007bff !important;
            color: white !important;
        }

        .content {
            background-color: #f5f5f5;
            margin-left: 200px;
            padding: 20px;
            padding-top: 100px;
            min-height: 100vh;
            width: calc(100% - 200px);
        }

        .table-container, .form-container {
            max-width: 100%;
            padding: 20px;
            border: 1px solid #d3d3d3;
            border-radius: 5px;
            background-color: white;
        }

        .table-header {
            background-color: #e9ecef;
            padding: 10px 15px;
            margin: -20px -20px 20px -20px;
            font-weight: bold;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
        }

        .table tbody tr:nth-child(odd) {
            background-color: #e9ecef;
        }

        .table tbody tr:nth-child(even) {
            background-color: white;
        }

        .table thead th {
            border-bottom: none !important;
        }

        .table thead, .table tbody {
            border: none !important;
        }

        .table tbody tr td {
            border-bottom: 1px solid #dee2e6 !important;
        }

        .table tbody tr:last-child td {
            border-bottom: none !important;
        }

        .btn-edit {
            background-color: #17a2b8;
            border: none;
            color: white;
        }

        .btn-delete {
            background-color: #dc3545;
            border: none;
            color: white;
        }

        .tab-content, .tab-pane {
            width: 100%;
        }

        .tab-pane {
            padding-bottom: 40px;
        }

        .form-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 0;
            margin: 0;
        }

        .form-header {
            background-color: #e9ecef;
            padding: 10px 15px;
            margin: 0;
            font-weight: bold;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
            text-align: left;
            width: 100%;
        }

        .form-label {
            display: block;
            text-align: center;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-control {
            width: 100%;
            max-width: 500px;
            min-width: 300px;
        }

        .role-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            border: 1px solid #ced4da;
            padding: 2px 5px;
            border-radius: 5px;
            background-color: #f8f9fa;
            margin-bottom: 10px;
        }

        .role-btn {
            background: none;
            border: none;
            padding: 0;
            color: #000000;
            text-decoration: none;
            cursor: pointer;
            margin-bottom: 2px;
            line-height: 1.2;
        }

        .role-btn:hover {
            color: #333333;
        }

        .role-btn.selected {
            background-color: #007bff;
            color: white;
        }

        .btn-success {
            background-color: #28a745;
            border: none;
            padding: 5px 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .modal-body .form-control {
            max-width: 300px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
        <span class="navbar-text text-white">
          <span th:text="${#authentication.principal.firstName} + ' with roles ' + ${#authentication.authorities} ?: 'Guest'"></span>
        </span>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-link text-secondary text-decoration-none">Logout</button>
        </form>
    </div>
</nav>

<div class="sidebar">
    <div th:classappend="${currentSection == 'admin'} ? 'active' : ''" class="sidebar-item"
         sec:authorize="hasRole('ROLE_ADMIN')">Admin
    </div>
    <div th:classappend="${currentSection == 'user'} ? 'active' : ''" class="sidebar-item"
         sec:authorize="hasRole('ROLE_ADMIN')">User
    </div>
    <div th:classappend="${currentSection == 'user'} ? 'active' : ''" class="sidebar-item"
         sec:authorize="hasRole('ROLE_USER')">User
    </div>
</div>

<div class="content">
    <h1>Admin panel (REST)</h1>
    <ul class="nav nav-tabs">
        <li class="nav-item">
            <a class="nav-link active" id="all-users-tab" data-bs-toggle="tab" href="#all-users">All users</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="new-user-tab" data-bs-toggle="tab" href="#new-user">New User</a>
        </li>
    </ul>
    <div class="tab-content">
        <div class="tab-pane fade show active" id="all-users">
            <div class="table-container">
                <h6 class="table-header">All users</h6>
                <table class="table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Second Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                    </thead>
                    <tbody id="userTableBody"></tbody>
                </table>
            </div>
        </div>
        <div class="tab-pane fade" id="new-user">
            <div class="form-container">
                <h6 class="form-header">Add new user</h6>
                <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>
                <form id="addUserForm">
                    <div class="mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" id="newUserFirstName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Second Name</label>
                        <input type="text" id="newUserSecondName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="newUserEmail" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="newUserPassword" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Roles</label>
                        <select id="newUserRoles" name="roles" multiple class="form-control">
                            <option value="ROLE_USER">USER</option>
                            <option value="ROLE_ADMIN">ADMIN</option>
                        </select>
                    </div>
                    <div class="d-flex justify-content-center">
                        <button type="submit" class="btn btn-success mt-2">Add new user</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel"
             aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editUserModalLabel">Edit user</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="editUserForm">
                            <div class="mb-3">
                                <label class="form-label">ID</label>
                                <input type="text" name="id" class="form-control" id="editUserId" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">First Name</label>
                                <input type="text" name="firstName" class="form-control" id="editUserFirstName"
                                       required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Second Name</label>
                                <input type="text" name="secondName" class="form-control" id="editUserSecondName"
                                       required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" id="editUserEmail" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control" id="editUserPassword"
                                       placeholder="Leave blank to keep unchanged">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Roles</label>
                                <select name="roles" id="editUserRoles" multiple class="form-control">
                                    <option value="ROLE_USER">USER</option>
                                    <option value="ROLE_ADMIN">ADMIN</option>
                                </select>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                <button type="submit" class="btn btn-primary">Edit</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal fade" id="deleteUserModal" tabindex="-1" aria-labelledby="deleteUserModalLabel"
             aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="deleteUserModalLabel">Delete User</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="deleteUserForm">
                            <div class="mb-3">
                                <label class="form-label">ID</label>
                                <input type="text" name="id" class="form-control" id="deleteUserId" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">First Name</label>
                                <input type="text" class="form-control" id="deleteUserFirstName" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Second Name</label>
                                <input type="text" class="form-control" id="deleteUserSecondName" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="deleteUserEmail" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Role</label>
                                <input type="text" class="form-control" id="deleteUserRole" readonly>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                <button type="submit" class="btn btn-danger">Delete</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-gtEjrD/SeCtmISkJkNUaaKMoLD0//ElJ19smozuHV6z3Iehds+3Ulb9Bn9Plx0x4"
        crossorigin="anonymous"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        fetch('/admin-rest/users')
            .then(response => response.json())
            .then(users => {
                const tableBody = document.querySelector('#userTableBody');
                tableBody.innerHTML = '';
                users.forEach(user => {
                    const rolesDisplay = user.roles.map(role => role.name.replace('ROLE_', '')).join(', ');
                    tableBody.innerHTML += `
                    <tr>
                        <td>${user.id}</td>
                        <td>${user.firstName}</td>
                        <td>${user.secondName}</td>
                        <td>${user.email}</td>
                        <td>${rolesDisplay || 'NO ROLE'}</td>
                        <td><button class="btn btn-sm btn-edit" onclick="openEditModal(${user.id})">Edit</button></td>
                        <td><button class="btn btn-sm btn-delete" onclick="openDeleteModal(${user.id})">Delete</button></td>
                    </tr>`;
                });
            })
            .catch(error => console.error('Error loading users:', error));
    });

    function openEditModal(id) {
        fetch(`/admin-rest/users/${id}`)
            .then(response => {
                if (!response.ok) throw new Error('User not found');
                return response.json();
            })
            .then(user => {
                document.getElementById('editUserId').value = user.id;
                document.getElementById('editUserFirstName').value = user.firstName;
                document.getElementById('editUserSecondName').value = user.secondName;
                document.getElementById('editUserEmail').value = user.email;
                const roleSelect = document.getElementById('editUserRoles');
                Array.from(roleSelect.options).forEach(option => {
                    option.selected = user.roles.some(role => role.name === option.value);
                });
                new bootstrap.Modal(document.getElementById('editUserModal')).show();
            })
            .catch(error => console.error('Error loading user:', error));
    }

    document.getElementById('editUserForm').addEventListener('submit', function (event) {
        event.preventDefault();
        const id = document.getElementById('editUserId').value;
        const selectedRoles = Array.from(document.getElementById('editUserRoles').selectedOptions)
            .map(option => ({name: option.value}));
        const user = {
            id: id,
            firstName: document.getElementById('editUserFirstName').value,
            secondName: document.getElementById('editUserSecondName').value,
            email: document.getElementById('editUserEmail').value,
            password: document.getElementById('editUserPassword').value,
            roles: selectedRoles
        };
        fetch(`/admin-rest/users/${id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(user),
            credentials: 'include'
        })
            .then(response => {
                if (!response.ok) throw new Error('Error updating user');
                return response.json();
            })
            .then(updatedUser => {
                const tableBody = document.querySelector('#userTableBody');
                const row = Array.from(tableBody.rows).find(row => row.cells[0].textContent === String(updatedUser.id));
                if (row) {
                    row.cells[1].textContent = updatedUser.firstName;
                    row.cells[2].textContent = updatedUser.secondName;
                    row.cells[3].textContent = updatedUser.email;
                    const rolesDisplay = updatedUser.roles.map(role => role.name.replace('ROLE_', '')).join(', ');
                    row.cells[4].textContent = rolesDisplay || 'NO ROLE';
                }
                bootstrap.Modal.getInstance(document.getElementById('editUserModal')).hide();
            })
            .catch(error => {
                console.error('Error updating user:', error);
                alert('Error updating user: ' + error.message);
            });
    });

    function openDeleteModal(id) {
        fetch(`/admin-rest/users/${id}`)
            .then(response => {
                if (!response.ok) throw new Error('User not found');
                return response.json();
            })
            .then(user => {
                document.getElementById('deleteUserId').value = user.id;
                document.getElementById('deleteUserFirstName').value = user.firstName;
                document.getElementById('deleteUserSecondName').value = user.secondName;
                document.getElementById('deleteUserEmail').value = user.email;
                document.getElementById('deleteUserRole').value = user.roles[0]?.name.replace('ROLE_', '') || 'NO ROLE';
                new bootstrap.Modal(document.getElementById('deleteUserModal')).show();
            })
            .catch(error => {
                console.error('Error deleting user:', error);
                alert('Error deleting user: ' + error.message); // Временный alert для отладки
            });
    }

    document.getElementById('deleteUserForm').addEventListener('submit', function (event) {
        event.preventDefault();
        const id = document.getElementById('deleteUserId').value;
        fetch(`/admin-rest/users/${id}`, {
            method: 'DELETE'
        })
            .then(response => {
                if (!response.ok) throw new Error('Error deleting user');
                // Удалить строку из таблицы
                const tableBody = document.querySelector('#userTableBody');
                const row = Array.from(tableBody.rows).find(row => row.cells[0].textContent == id);
                if (row) row.remove();
                bootstrap.Modal.getInstance(document.getElementById('deleteUserModal')).hide();
            })
            .catch(error => console.error('Error deleting user:', error));
    });

    document.getElementById('addUserForm').addEventListener('submit', function (event) {
        event.preventDefault();
        const selectedRoles = Array.from(document.getElementById('newUserRoles').selectedOptions)
            .map(option => ({name: option.value}));
        const user = {
            firstName: document.getElementById('newUserFirstName').value,
            secondName: document.getElementById('newUserSecondName').value,
            email: document.getElementById('newUserEmail').value,
            password: document.getElementById('newUserPassword').value,
            roles: selectedRoles // Отправляем список ролей
        };
        fetch('/admin-rest/users', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(user),
            credentials: 'include'
        })
            .then(response => {
                if (!response.ok) throw new Error('Error creating user');
                return response.json();
            })
            .then(newUser => {
                const tableBody = document.querySelector('#userTableBody');
                const rolesDisplay = newUser.roles.map(role => role.name.replace('ROLE_', '')).join(', ');
                tableBody.innerHTML += `
                <tr>
                    <td>${newUser.id}</td>
                    <td>${newUser.firstName}</td>
                    <td>${newUser.secondName}</td>
                    <td>${newUser.email}</td>
                    <td>${rolesDisplay || 'NO ROLE'}</td>
                    <td><button class="btn btn-sm btn-edit" onclick="openEditModal(${newUser.id})">Edit</button></td>
                    <td><button class="btn btn-sm btn-delete" onclick="openDeleteModal(${newUser.id})">Delete</button></td>
                </tr>`;
                this.reset();
            })
            .catch(error => {
                document.getElementById('errorMessage').textContent = error.message;
                document.getElementById('errorMessage').style.display = 'block';
            });
    });

    function selectRole(role) {
        document.getElementById('roleInput').value = role;
        var buttons = document.querySelectorAll('.role-btn');
        buttons.forEach(btn => btn.classList.remove('selected'));
        event.target.classList.add('selected');
    }
</script>
</body>
</html>
