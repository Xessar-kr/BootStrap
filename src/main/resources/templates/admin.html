<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <style>
        .sidebar {
            height: 100vh;
            width: 200px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #ffffff;
            padding-top: 80px;
        }

        .sidebar-item {
            padding: 10px 15px;
            text-decoration: none;
            color: #007bff;
            display: block;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 5px;
        }

        .sidebar-item.active {
            background-color: #007bff;
            color: white;
        }

        .content {
            background-color: #f5f5f5;
            margin-left: 200px;
            padding: 20px;
            padding-top: 100px;
            min-height: 100vh;
        }

        .table-container, .form-container {
            max-width: 100%;
            padding: 20px;
            border: 1px solid #d3d3d3;
            border-radius: 5px;
            background-color: white;
        }

        .table-header {
            background-color: #e9ecef;
            padding: 10px 15px;
            margin: -20px -20px 20px -20px;
            font-weight: bold;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
        }

        .table tbody tr:nth-child(odd) {
            background-color: #e9ecef;
        }

        .table tbody tr:nth-child(even) {
            background-color: white;
        }

        .table thead th {
            border-bottom: none !important;
        }

        .table thead, .table tbody {
            border: none !important;
        }

        .table tbody tr td {
            border-bottom: 1px solid #dee2e6 !important;
        }

        .table tbody tr:last-child td {
            border-bottom: none !important;
        }

        .btn-edit {
            background-color: #17a2b8;
            border: none;
            color: white;
        }

        .btn-delete {
            background-color: #dc3545;
            border: none;
            color: white;
        }

        .btn-success {
            background-color: #28a745;
            border: none;
        }

        .tab-content, .tab-pane {
            width: 100%;
        }

        .tab-pane {
            padding-bottom: 40px;
        }

        .content {
            background-color: #f5f5f5;
            margin-left: 200px;
            padding: 20px;
            padding-top: 100px;
            min-height: 100vh;
            width: calc(100% - 200px);
        }

        .form-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 0;
            margin: 0;
        }

        .form-header {
            background-color: #e9ecef;
            padding: 10px 15px;
            margin: 0;
            font-weight: bold;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
            text-align: left;
            width: 100%;
        }

        .form-label {
            display: block;
            text-align: center;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-control {
            width: 100%;
            max-width: 500px;
            min-width: 300px;
        }

        .role-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            border: 1px solid #ced4da;
            padding: 2px 5px;
            border-radius: 5px;
            background-color: #f8f9fa;
            margin-bottom: 10px;
        }

        .role-btn {
            background: none;
            border: none;
            padding: 0;
            color: #000000;
            text-decoration: none;
            cursor: pointer;
            margin-bottom: 2px;
            line-height: 1.2;
        }

        .role-btn:hover {
            color: #333333;
        }
        .role-btn.selected {
            background-color: #007bff;
            color: white;
        }
        .btn-success {
            background-color: #28a745;
            border: none;
            padding: 5px 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .modal-body .form-control {
            max-width: 300px; /* Ограничиваем ширину полей */
            margin: 0 auto; /* Центрируем поля */
        }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
        <span class="navbar-text text-white">
          <span th:text="${#authentication.principal.firstName} + ' with roles ' + ${#authentication.authorities} ?: 'Guest'"></span>
        </span>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-link text-secondary text-decoration-none">Logout</button>
        </form>
    </div>
</nav>

<div class="sidebar">
    <div th:classappend="${currentSection == 'admin'} ? 'active' : ''" class="sidebar-item"
         sec:authorize="hasRole('ROLE_ADMIN')">Admin
    </div>
    <div th:classappend="${currentSection == 'user'} ? 'active' : ''" class="sidebar-item"
         sec:authorize="hasRole('ROLE_ADMIN')">User
    </div>
    <div th:classappend="${currentSection == 'user'} ? 'active' : ''" class="sidebar-item"
         sec:authorize="hasRole('ROLE_USER')">User
    </div>
</div>

<div class="content">
    <h1>Admin panel</h1>
    <ul class="nav nav-tabs">
        <li class="nav-item">
            <a class="nav-link active" id="all-users-tab" data-bs-toggle="tab" href="#all-users">All users</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="new-user-tab" data-bs-toggle="tab" href="#new-user">New User</a>
        </li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="all-users">
            <div class="table-container">
                <h6 class="table-header">All users</h6>
                <table class="table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Second Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}"></td>
                        <td th:text="${user.firstName}"></td>
                        <td th:text="${user.secondName}"></td>
                        <td th:text="${user.email}"></td>
                        <td>
                            <span th:if="${user.roles != null and !user.roles.isEmpty()}">
                            <span th:each="role : ${user.roles}">
                                <span th:text="'[' + (${role.name} == 'ROLE_ADMIN' ? 'ADMIN' : 'USER') + ']'"></span>
                            </span>
                            </span>
                            <span th:if="${user.roles == null or user.roles.isEmpty()}">[NO ROLE]</span>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-edit"
                                    data-bs-toggle="modal"
                                    data-bs-target="#editUserModal"
                                    th:attr="data-id=${user.id},
                     data-firstName=${user.firstName},
                     data-secondName=${user.secondName},
                     data-email=${user.email},
                     data-role=${user.roles != null and !user.roles.isEmpty()} ? ${user.roles[0].name}">
                                Edit
                            </button>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-delete"
                                    data-bs-toggle="modal"
                                    data-bs-target="#deleteUserModal"
                                    th:attr="data-id=${user.id},
                                         data-firstName=${user.firstName},
                                         data-secondName=${user.secondName},
                                         data-email=${user.email},
                                         data-role=${user.roles != null and !user.roles.isEmpty()} ? ${user.roles[0].name}">
                                Delete
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>


        <div class="tab-pane fade" id="new-user">
            <div class="form-container">
                <h6 class="form-header">Add new user</h6>
                <div th:if="${error != null}" class="alert alert-danger">
                    <span th:text="${error}"></span>
                </div>
                <form th:action="@{/admin/create}" th:object="${newUser}" method="post">
                    <div class="mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" th:field="*{firstName}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Second Name</label>
                        <input type="text" th:field="*{secondName}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" th:field="*{password}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <div class="role-container">
                            <input type="hidden" name="role" id="roleInput">
                            <button type="button" class="role-btn mb-2" onclick="selectRole('ROLE_ADMIN')">ADMIN</button>
                            <button type="button" class="role-btn" onclick="selectRole('ROLE_USER')">USER</button>
                        </div>
                    </div>
                    <div class="d-flex justify-content-center">
                        <button type="submit" class="btn btn-success mt-2">Add new user</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="modal fade" id="editUserModal" tabindex="-1" aria-labelledby="editUserModalLabel"
             aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editUserModalLabel">Edit user</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form th:action="@{/admin/update}" method="post">
                            <div class="mb-3">
                                <label class="form-label">ID</label>
                                <input type="text" name="id" class="form-control" id="editUserId" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">First Name</label>
                                <input type="text" name="firstName" class="form-control" id="editUserFirstName" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Second Name</label>
                                <input type="text" name="secondName" class="form-control" id="editUserSecondName" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" id="editUserEmail" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control" id="editUserPassword" placeholder="Leave blank to keep unchanged">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Role</label>
                                <select name="role" class="form-control" id="editUserRole">
                                    <option value="ROLE_ADMIN">ADMIN</option>
                                    <option value="ROLE_USER">USER</option>
                                </select>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                <button type="submit" class="btn btn-primary">Edit</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal fade" id="deleteUserModal" tabindex="-1" aria-labelledby="deleteUserModalLabel"
             aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="deleteUserModalLabel">Delete User</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form th:action="@{/admin/delete}" method="post">
                            <div class="mb-3">
                                <label class="form-label">ID</label>
                                <input type="text" name="id" class="form-control" id="deleteUserId" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">First Name</label>
                                <input type="text" class="form-control" id="deleteUserFirstName" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Second Name</label>
                                <input type="text" class="form-control" id="deleteUserSecondName" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="deleteUserEmail" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Role</label>
                                <input type="text" class="form-control" id="deleteUserRole" readonly>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                <button type="submit" class="btn btn-danger">Delete</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-gtEjrD/SeCtmISkJkNUaaKMoLD0//ElJ19smozuHV6z3Iehds+3Ulb9Bn9Plx0x4"
        crossorigin="anonymous"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var editModal = document.getElementById('editUserModal');
        editModal.addEventListener('show.bs.modal', function (event) {
            var button = event.relatedTarget; // Кнопка, которая открыла модальное окно
            var id = button.getAttribute('data-id');
            var firstName = button.getAttribute('data-firstName');
            var secondName = button.getAttribute('data-secondName');
            var email = button.getAttribute('data-email');
            var role = button.getAttribute('data-role');

            document.getElementById('editUserId').value = id || '';
            document.getElementById('editUserFirstName').value = firstName || '';
            document.getElementById('editUserSecondName').value = secondName || '';
            document.getElementById('editUserEmail').value = email || '';
            document.getElementById('editUserRole').value = role || 'ROLE_USER';
        });

        var deleteModal = document.getElementById('deleteUserModal');
        deleteModal.addEventListener('show.bs.modal', function (event) {
            var button = event.relatedTarget; // Кнопка, которая открыла модальное окно
            var id = button.getAttribute('data-id');
            var firstName = button.getAttribute('data-firstName');
            var secondName = button.getAttribute('data-secondName');
            var email = button.getAttribute('data-email');
            var role = button.getAttribute('data-role');

            document.getElementById('deleteUserId').value = id || '';
            document.getElementById('deleteUserFirstName').value = firstName || '';
            document.getElementById('deleteUserSecondName').value = secondName || '';
            document.getElementById('deleteUserEmail').value = email || '';
            document.getElementById('deleteUserRole').value = role ? (role === 'ROLE_ADMIN' ? 'ADMIN' : 'USER') : 'NO ROLE';
        });
    });

    function selectRole(role) {
        document.getElementById('roleInput').value = role;
        var buttons = document.querySelectorAll('.role-btn');
        buttons.forEach(btn => btn.classList.remove('selected'));
        event.target.classList.add('selected');
    }
</script>
</body>
</html>
