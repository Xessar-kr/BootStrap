<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <style>
        .sidebar {
            height: 100vh;
            width: 200px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #ffffff;
            padding-top: 80px;
        }

        .sidebar-item {
            padding: 10px 15px;
            text-decoration: none;
            color: #007bff;
            display: block;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 5px;
        }

        .sidebar-item.active {
            background-color: #007bff;
            color: white;
        }

        .content {
            background-color: #f5f5f5;
            margin-left: 200px;
            padding: 20px;
            padding-top: 100px;
            min-height: 100vh;
        }

        .table-container, .form-container {
            max-width: 100%;
            padding: 20px;
            border: 1px solid #d3d3d3;
            border-radius: 5px;
            background-color: white;
        }

        .table-header {
            background-color: #e9ecef;
            padding: 10px 15px;
            margin: -20px -20px 20px -20px;
            font-weight: bold;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
        }

        .table tbody tr:nth-child(odd) {
            background-color: #e9ecef;
        }

        .table tbody tr:nth-child(even) {
            background-color: white;
        }

        .table thead th {
            border-bottom: none !important;
        }

        .table thead, .table tbody {
            border: none !important;
        }

        .table tbody tr td {
            border-bottom: 1px solid #dee2e6 !important;
        }

        .table tbody tr:last-child td {
            border-bottom: none !important;
        }

    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
        <span class="navbar-text text-white">
          <span th:text="${#authentication.principal.firstName} + ' with roles ' + ${#authentication.authorities} ?: 'Guest'"></span>
        </span>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-link text-secondary text-decoration-none">Logout</button>
        </form>
    </div>
</nav>

<div class="sidebar">
    <div th:classappend="${currentSection == 'admin'} ? 'active' : ''" class="sidebar-item"
         sec:authorize="hasRole('ROLE_ADMIN')">Admin
    </div>
    <div th:classappend="${currentSection == 'user'} ? 'active' : ''" class="sidebar-item"
         sec:authorize="hasRole('ROLE_ADMIN')">User
    </div>
    <div th:classappend="${currentSection == 'user'} ? 'active' : ''" class="sidebar-item"
         sec:authorize="hasRole('ROLE_USER')">User
    </div>
</div>
<div class="content">
    <h1>User information age</h1>
    <div class="table-container">
        <h6 class="table-header">About user</h6>
        <table class="table">
            <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Second Name</th>
                <th>Email</th>
                <th>Role</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.firstName}"></td>
                <td th:text="${user.secondName}"></td>
                <td th:text="${user.email}"></td>
                <td>
                    <span th:if="${user.roles != null and !user.roles.isEmpty()}">
                        <span th:each="role : ${user.roles}">
                            <span th:text="'[' + (${role.name} == 'ROLE_ADMIN' ? 'ADMIN' : 'USER') + ']'"></span>
                        </span>
                    </span>
                    <span th:if="${user.roles == null or user.roles.isEmpty()}">[NO ROLE]</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
